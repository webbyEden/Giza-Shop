    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let currentRating = 5;
        let db;
        let auth;
        let appId = typeof __app_id !== 'undefined' ? __app_id : 'giza-shop-app';

        // Initialize Firebase on load
        window.addEventListener('DOMContentLoaded', async () => {
            setRating(5);
            try {
                if (typeof __firebase_config !== 'undefined') {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    
                    initFirestoreListener();
                } else {
                    // Fallback local initial reviews if offline/no firebase
                    loadDefaultReviews();
                }
            } catch (e) {
                console.error("Firebase init error:", e);
                loadDefaultReviews();
            }
        });

        // Listen to Firestore reviews in real-time
        function initFirestoreListener() {
            if (!db) return;
            const reviewsRef = collection(db, 'artifacts', appId, 'public', 'data', 'customer_reviews');
            onSnapshot(reviewsRef, (snapshot) => {
                const reviews = [];
                snapshot.forEach(doc => {
                    reviews.push({ id: doc.id, ...doc.data() });
                });

                // Sort by timestamp descending (newest first)
                reviews.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                renderReviews(reviews);
            }, (error) => {
                console.error("Firestore snapshot error:", error);
                loadDefaultReviews();
            });
        }

        function loadDefaultReviews() {
            const defaultReviews = [
                { name: 'คุณมินต์ (Mind)', rating: 5, comment: 'งานสวยไวมากเลยค่ะ ตรงเรฟสุดๆ ประทับใจมากค่า ไว้มาอุดหนุนอีกแน่นอนค่ะ', createdAt: Date.now() - 2000 },
                { name: 'คุณพลอย (Ploy)', rating: 5, comment: 'แม่ค้าน่ารักเป็นกันเอง งานเนียบละเอียดมากค่ะ แนะนำนะค่ะร้านนี้', createdAt: Date.now() - 1000 }
            ];
            renderReviews(defaultReviews);
        }

        function renderReviews(reviews) {
            const reviewsList = document.getElementById('reviewsList');
            reviewsList.innerHTML = '';

            let sum = 0;
            reviews.forEach(review => {
                sum += parseInt(review.rating || 5, 10);
                const starsHtml = '★'.repeat(parseInt(review.rating)) + '☆'.repeat(5 - parseInt(review.rating));

                const reviewCard = document.createElement('div');
                reviewCard.className = 'bg-[#FFFEFE] rounded-3xl p-4 shadow-sm border border-[#FAF1F5] flex flex-col gap-2';
                reviewCard.setAttribute('data-rating', review.rating);
                reviewCard.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="font-bold text-xs text-[#7d5658]">${escapeHtml(review.name)}</span>
                        <div class="text-amber-400 text-sm">${starsHtml}</div>
                    </div>
                    <p class="text-xs text-[#7d5658] leading-relaxed">${escapeHtml(review.comment)}</p>
                `;
                reviewsList.appendChild(reviewCard);
            });

            const total = reviews.length;
            const avg = total > 0 ? (sum / total).toFixed(1) : '5.0';
            document.getElementById('totalReviewsText').innerText = `(${total} รีวิว)`;
            document.getElementById('avgRatingText').innerText = `★ ${avg}`;
        }

        // Make submitReview globally available
        window.submitReview = async function(event) {
            event.preventDefault();
            const name = document.getElementById('reviewerName').value.trim();
            const comment = document.getElementById('reviewerComment').value.trim();

            if (!name || !comment) return;

            const newReview = {
                name: name,
                rating: currentRating,
                comment: comment,
                createdAt: Date.now()
            };

            try {
                if (db && auth && auth.currentUser) {
                    const reviewsRef = collection(db, 'artifacts', appId, 'public', 'data', 'customer_reviews');
                    await addDoc(reviewsRef, newReview);
                } else {
                    // Fallback to local DOM addition if db is uninitialized
                    const reviewsList = document.getElementById('reviewsList');
                    const starsHtml = '★'.repeat(currentRating) + '☆'.repeat(5 - currentRating);
                    const reviewCard = document.createElement('div');
                    reviewCard.className = 'bg-[#FFFEFE] rounded-3xl p-4 shadow-sm border border-[#FAF1F5] flex flex-col gap-2';
                    reviewCard.setAttribute('data-rating', currentRating);
                    reviewCard.innerHTML = `
                        <div class="flex justify-between items-start">
                            <span class="font-bold text-xs text-[#7d5658]">${escapeHtml(name)}</span>
                            <div class="text-amber-400 text-sm">${starsHtml}</div>
                        </div>
                        <p class="text-xs text-[#7d5658] leading-relaxed">${escapeHtml(comment)}</p>
                    `;
                    reviewsList.insertBefore(reviewCard, reviewsList.firstChild);
                }
                showToast('ส่งรีวิวเรียบร้อยแล้วค่ะ ขอบคุณค่ะ ♡');
            } catch (e) {
                console.error("Error adding review:", e);
                showToast('เกิดข้อผิดพลาดในการบันทึกรีวิว');
            }

            // Reset form
            document.getElementById('reviewForm').reset();
            setRating(5);
        };

        // Star rating selection
        window.setRating = function(rating) {
            currentRating = rating;
            const stars = document.querySelectorAll('#starContainer span');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.remove('text-slate-300');
                    star.classList.add('text-amber-400');
                } else {
                    star.classList.remove('text-amber-400');
                    star.classList.add('text-slate-300');
                }
            });
        };

        // Function to copy text with robust fallback
        window.copyText = function(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('คัดลอก ' + text + ' สำเร็จ!');
                }).catch(err => {
                    fallbackCopyText(text);
                });
            } else {
                fallbackCopyText(text);
            }
        };

        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('คัดลอก ' + text + ' สำเร็จ!');
            } catch (err) {
                showToast('เกิดข้อผิดพลาดในการคัดลอก');
            }
            document.body.removeChild(textArea);
        }

        // Show toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.opacity = '1';
            toast.style.pointerEvents = 'auto';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.pointerEvents = 'none';
            }, 2500);
        }

        // Helper to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Download QR Code Action
        window.downloadQRImage = function() {
            showToast('กำลังดาวน์โหลดรูปภาพ QR Code...');
            const imageUrl = 'https://i.ibb.co/6ctSxdJm/Untitled-Artwork29-20261114010753.png';
            const filename = 'gizashop-qr-payment.png';
            
            fetch(imageUrl, { mode: 'cors' })
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(blobUrl);
                })
                .catch(err => {
                    window.open(imageUrl, '_blank');
                    showToast('เปิดรูปภาพสำหรับบันทึกแล้วค่ะ');
                });
        };
    </script>
</body>
</html>
